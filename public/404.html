<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <title>আমার মদন</title>
    <script>
      // GitHub Pages SPA fallback. A deep link like /amar-madan/rokto is served
      // by this 404 page; we hand the path to index.html, which restores it
      // with history.replaceState so /rokto still resolves to the right view.
      var base = '/amar-madan';
      var path = location.pathname + location.search;
      var appPath = path.indexOf(base) === 0 ? path.slice(base.length) : path;
      if (!appPath) appPath = '/';
      location.replace(base + '/?p=' + encodeURIComponent(appPath));
    </script>
  </head>
  <body></body>
</html>
